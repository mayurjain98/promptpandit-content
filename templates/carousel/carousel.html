<!doctype html>
<!--
  Prompt Pandit carousel slide (1080x1350).
  The renderer (scripts/render_carousel.py) opens this file and calls
  window.renderSlide(slide, index, total, series) once per slide, then
  takes a screenshot.

  Slide types:
    cover        { title, highlight?, subtitle? }
    content      { kicker?, title, body?, bullets? [] }
    prompt       { title, prompt, note? }            copy-paste prompt box
    before_after { title?, before, after, why? }     Galat vs Sahi
    cta          { title?, text? }                   last slide
  In any text, wrap words in *stars* to make them glossy lime.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand/brand.css">
<style>
  body { width: 1080px; height: 1350px; }
  .canvas { width: 1080px; height: 1350px; padding: 84px 84px 120px; display: flex; flex-direction: column; }

  /* Top bar: series pill + page counter */
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 56px; }
  .top .pill { font-size: 26px; padding: 12px 26px; }
  .counter { font: 600 26px "Poppins"; color: var(--muted); letter-spacing: .05em; }

  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  /* Swipe hint, bottom-left (watermark sits bottom-right) */
  .swipe { position: absolute; left: 84px; bottom: 46px; font: 600 26px "Poppins"; color: var(--muted); display: flex; gap: 12px; align-items: center; }
  .swipe b { color: var(--lime-mid); font-size: 34px; }

  /* COVER */
  /* Black wordmark shown as a deliberate glossy plate (its background is dark grey, not transparent) */
  .cover .wordmark { width: 560px; margin-bottom: 70px; border-radius: 28px; border: 1px solid rgba(255,255,255,.09);
                     box-shadow: var(--shadow), 0 0 50px rgba(198,255,0,.10); }
  .cover h1 { font-size: 96px; margin-bottom: 36px; }
  .cover .sub { font-size: 40px; line-height: 1.4; color: #e8e8e8; max-width: 860px; }

  /* CONTENT */
  .kicker { font: 700 30px "Poppins"; color: var(--lime-mid); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 22px; }
  .content h2 { font-size: 68px; margin-bottom: 36px; }
  .content .body { font-size: 38px; line-height: 1.5; color: #e6e6e6; }
  .bullets { list-style: none; margin-top: 30px; display: flex; flex-direction: column; gap: 22px; }
  .bullets li { font-size: 36px; line-height: 1.4; padding: 26px 30px 26px 84px; position: relative; }
  .bullets li::after { content: "✓"; position: absolute; left: 28px; top: 24px; font: 700 34px "Poppins"; color: var(--lime-mid); }

  /* PROMPT BOX */
  .prompt h2 { font-size: 60px; margin-bottom: 40px; }
  .promptbox { padding: 64px 52px 52px; }
  .promptbox .label { position: absolute; top: -24px; left: 44px; font-size: 24px; padding: 10px 22px; }
  .promptbox .copy { position: absolute; top: 26px; right: 32px; font: 600 22px "Poppins"; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .promptbox pre { white-space: pre-wrap; font: 500 34px/1.55 "Inter"; color: #f4f4f4; }
  .promptbox pre .ph { color: var(--lime-top); font-weight: 700; }   /* [placeholders] */
  .prompt .note { margin-top: 36px; font-size: 32px; color: var(--muted); line-height: 1.45; }

  /* BEFORE / AFTER */
  .ba h2 { font-size: 58px; margin-bottom: 36px; }
  .ba .box { padding: 40px 44px; margin-bottom: 28px; }
  .ba .tag { font: 700 30px "Poppins"; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; }
  .ba .tag.bad { color: var(--galat); }
  .ba .tag.good { color: var(--lime-mid); }
  .ba p { font-size: 34px; line-height: 1.5; color: #eee; }
  .ba .bad-text { color: #bdbdbd; }
  .ba .why { font-size: 30px; color: var(--muted); line-height: 1.45; margin-top: 6px; }

  /* CTA */
  .cta { align-items: center; text-align: center; }
  .cta .logo { width: 300px; margin-bottom: 50px; filter: drop-shadow(0 0 50px rgba(198,255,0,.25)); }
  .cta h2 { font-size: 76px; margin-bottom: 30px; }
  .cta .text { font-size: 38px; color: #e6e6e6; line-height: 1.45; margin-bottom: 56px; max-width: 820px; }
  .cta .pill { font-size: 34px; padding: 24px 44px; white-space: nowrap; }
  .cta .icons { margin-top: 44px; display: flex; gap: 46px; font: 600 28px "Poppins"; color: var(--muted); }
  .cta .icons span { display: flex; align-items: center; gap: 10px; }
  .cta .icons svg { width: 30px; height: 30px; stroke: var(--lime-mid); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="canvas" id="slide"></div>
<script>
  const BRAND = "../brand/";
  const CTA = "Save karo, follow karo @promptpandit.in";

  // Escape HTML, then turn *word* into glossy lime and [x] into a placeholder.
  function fmt(s) {
    if (!s) return "";
    const esc = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return esc.replace(/\*(.+?)\*/g, '<span class="lime">$1</span>')
              .replace(/\[(.+?)\]/g, '<span class="ph">[$1]</span>')
              .replace(/\n/g, "<br>");
  }

  const T = {
    cover: s => `
      <div class="main cover">
        <img class="wordmark" src="${BRAND}promptpandit_final_wordmark_black.png">
        <h1>${fmt(s.title)}</h1>
        ${s.subtitle ? `<p class="sub">${fmt(s.subtitle)}</p>` : ""}
      </div>`,

    content: s => `
      <div class="main content">
        ${s.kicker ? `<div class="kicker">${fmt(s.kicker)}</div>` : ""}
        <h2>${fmt(s.title)}</h2>
        ${s.body ? `<p class="body">${fmt(s.body)}</p>` : ""}
        ${s.bullets ? `<ul class="bullets">${s.bullets.map(b => `<li class="card">${fmt(b)}</li>`).join("")}</ul>` : ""}
      </div>`,

    prompt: s => `
      <div class="main prompt">
        <h2>${fmt(s.title)}</h2>
        <div class="card glow promptbox">
          <span class="pill label">PROMPT</span>
          <span class="copy">⧉ copy-paste</span>
          <pre>${fmt(s.prompt)}</pre>
        </div>
        ${s.note ? `<p class="note">${fmt(s.note)}</p>` : ""}
      </div>`,

    before_after: s => `
      <div class="main ba">
        ${s.title ? `<h2>${fmt(s.title)}</h2>` : ""}
        <div class="card bad box"><div class="tag bad">✗ Galat</div><p class="bad-text">${fmt(s.before)}</p></div>
        <div class="card glow box"><div class="tag good">✓ Sahi</div><p>${fmt(s.after)}</p></div>
        ${s.why ? `<p class="why">${fmt(s.why)}</p>` : ""}
      </div>`,

    cta: s => `
      <div class="main cta">
        <img class="logo" src="${BRAND}watermark_trimmed.png">
        <h2>${fmt(s.title || "Kaam ka laga?")}</h2>
        ${s.text ? `<p class="text">${fmt(s.text)}</p>` : ""}
        <span class="pill">${fmt(CTA)}</span>
        <div class="icons">
          <span><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Save</span>
          <span><svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>Share</span>
          <span><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>Follow</span>
        </div>
      </div>`,
  };

  window.renderSlide = (slide, index, total, series) => {
    const isLast = index === total;
    document.getElementById("slide").innerHTML = `
      <div class="top">
        <span class="pill">${fmt(series || "Prompt Pandit")}</span>
        <span class="counter">${index}/${total}</span>
      </div>
      ${T[slide.type](slide)}
      ${isLast ? "" : `<div class="swipe">Swipe karo <b>→</b></div>`}
      <img class="watermark" src="${BRAND}watermark_trimmed.png">`;
    // Resolve once fonts and images are ready, so the screenshot is complete.
    return Promise.all([
      document.fonts.ready,
      ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })),
    ]);
  };
</script>
</body>
</html>
