# Daily publisher: posts whatever is due in content/queue/schedule.json.
# IST = UTC + 5:30.  Reel 13:00 IST = 07:30 UTC, carousel 19:30 IST = 14:00 UTC.
#
# GitHub's scheduled runs are best-effort: they can be hours late or skipped.
# So we check every 20 minutes from 12:40 to 23:20 IST (at :10/:30/:50, away
# from the busy top of the hour). A run with nothing due exits in seconds, and
# an item is never posted twice, so extra runs are harmless.
# Backup: an outside scheduler also starts this workflow at 13:00 and 19:30 IST
# (see README, "Backup trigger").
# Pause any time by committing an empty file at data/pause.flag.
name: Publish

on:
  schedule:
    - cron: "10,30,50 7-17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: create containers only, don't post"
        type: boolean
        default: true
      item_id:
        description: "Only this item id (optional; required for dry run)"
        required: false

permissions:
  contents: write   # commit the log + move published files
  issues: write     # open an issue after 2 failures in a row

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main at run time, so a queued run sees earlier posts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml

      - name: Publish due items
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.item_id }}" ]; then ARGS="$ARGS --id ${{ inputs.item_id }}"; fi
          python scripts/publish.py $ARGS

      - name: Commit log and moved files
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "promptpandit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data content
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Publish log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
