# Daily: save 24h and 7-day metrics for every published post -> data/insights.json
# 18:30 UTC = 00:00 IST
name: Insights

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/insights.py
      - name: Commit
        run: |
          git config user.name "promptpandit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/insights.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Insights $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
